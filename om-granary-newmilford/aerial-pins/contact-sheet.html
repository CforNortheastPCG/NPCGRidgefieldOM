<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 24px; font-family: Arial; background: #f4f4f4; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.cell { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; text-align: center; }
.cell .imgbox { height: 80px; display: flex; align-items: center; justify-content: center; }
.cell img { max-width: 100%; max-height: 76px; object-fit: contain; }
.cell .name { font-size: 11px; color: #555; margin-top: 6px; font-weight: bold; }
</style></head><body>
<div class="grid" id="g"></div>
<script>
const slugs = ['homedepot','autozone','verizon','goodwill','aldi','mavis','wendys','walmart','stopandshop','kohls','tjmaxx','petco','homegoods','panera','jerseymikes','tacobell','att','dollartree','tractorsupply','starbucks','mcdonalds','enterprise','oreilly','carvel','kimberlyclark','cvs'];
document.getElementById('g').innerHTML = slugs.map(s => '<div class="cell"><div class="imgbox"><img src="logos/' + s + '.png" onerror="this.onerror=null;this.src=\'logos/' + s + '.svg\'"></div><div class="name">' + s + '</div></div>').join('');
</script>
</body></html>

name = "npcg-om-generator"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# KV namespace backing per-IP + global rate limiting in functions/api/generate.js
[[kv_namespaces]]
binding = "RL"
id = "5bd5b3159c7c482c86c7e845aa01dd91"

# Frontend builds to dist/ (Vite). Backend is /functions (Pages Functions).
# The Anthropic SDK in the function needs the nodejs_compat flag above.
#
# Required secrets (Pages → Settings → Variables and secrets, type "Secret"):
#   ANTHROPIC_API_KEY  — the shared NPCG Anthropic key (required)
#   OM_PASSWORD        — the access password (defaults to NPCGOM2026! if unset)
# Optional plain vars (override the defaults in code):
#   DAILY_LIMIT        — max successful generations per day, all users (default 300)
#   PER_MIN            — max requests per IP per minute (default 8)
